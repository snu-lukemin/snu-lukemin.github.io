<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Not Found</title>
    <meta name="description" content="Custom 404 page for minsh.info" />
    <link rel="stylesheet" href="assets/site.css" />
    <style>
      .background {
        background:
          radial-gradient(circle at 10% 10%, rgba(47, 111, 143, 0.08), transparent 32%),
          radial-gradient(circle at 90% 18%, rgba(111, 95, 168, 0.09), transparent 34%),
          #eef1f5;
      }

      .card {
        width: min(760px, 100%);
      }

      .missing-layout {
        display: grid;
        grid-template-columns: 190px 1fr;
        gap: 1.3rem;
        align-items: center;
      }

      .logo-wrap {
        display: grid;
        place-items: center;
      }

      .logo-badge {
        width: 186px;
        aspect-ratio: 1;
        border-radius: 2px;
        border: 1px solid rgba(31, 36, 48, 0.08);
        background: linear-gradient(145deg, #ffffff, #f8fbff);
        box-shadow: 0 10px 22px rgba(31, 36, 48, 0.08);
        display: grid;
        place-items: center;
      }

      .logo-badge img {
        width: 156px;
        height: 156px;
        object-fit: contain;
        filter: drop-shadow(0 4px 10px rgba(47, 111, 143, 0.28));
      }

      .eyebrow {
        margin-bottom: 0.6rem;
      }

      .error-code {
        margin: 0;
        color: var(--purple);
        font-family: "D2Coding", "Nanum Gothic Coding", "Courier New", monospace;
        font-size: clamp(2.6rem, 11vw, 4.6rem);
        line-height: 1;
      }

      .message {
        margin: 0.55rem 0 0;
        color: var(--text);
        font-size: clamp(1.05rem, 2.9vw, 1.35rem);
        font-weight: 700;
      }

      .desc {
        margin: 0.85rem 0 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .quick-links {
        margin-top: 1.2rem;
      }

      @media (max-width: 760px) {
        .missing-layout {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .quick-links {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <main class="shell">
      <section class="card" aria-labelledby="missing-page-title">
        <header class="hero">
          <div class="page-nav">
            <a href="index.html">Home</a>
            <a href="pages/contact.html">Contact</a>
            <a href="pages/experiences.html">Experiences</a>
            <a href="pages/presentations.html">Presentations</a>
            <a href="pages/publications.html">Publications</a>
            <a href="pages/trivia.html">Trivia</a>
          </div>
        </header>

        <div class="missing-layout">
          <div class="logo-wrap" aria-hidden="true">
            <div class="logo-badge">
              <img src="images/LOGO.png" alt="" />
            </div>
          </div>

          <div>
            <p class="error-code">404</p>
            <h1 class="message" id="missing-page-title"> Could not find that page.</h1>
            <p class="desc">
              You may have followed an old link or typed an address incorrectly.
              Please jump back to a known page using the links below.
            </p>
            <div class="quick-links">
              <a href="index.html">Back to Home</a>
              <a href="pages/publications.html">Go to Publications</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
